<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="İlk Buluşma">

<meta property="og:description" content="Kahve soğumadan beni ne kadar iyi tanıyabilirsin? ☕">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314161d'/%3E%3Cpath d='M32 50 L13 31 A10 10 0 0 1 32 17 A10 10 0 0 1 51 31Z' fill='%23ff5c7a'/%3E%3C/svg%3E">

<title>İlk Buluşma Simülatörü</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: full-bleed animated POV scene (SVG) with letterbox bars; one white bubble card docks at the bottom and the camera lifts the scene above it. Single cinematic look. */
:root{
  color-scheme: dark;
  --scene:#14161d; --scene-text:#eef0f6; --scene-dim:#a3a9bb;
  --ink:#1b1d26; --ink-soft:#5d6273; --paper:#ffffff; --line:#e7e8ee;
  --accent:#2f6df6; --good:#1e9e63; --bad:#d64545; --warm:#f2a65a;
  --skin:#f6d3b8; --skin-sh:#e2b08e; --hair:#f2cf6b; --hair-hi:#fbe39b; --hair-sh:#d4a43f; --hair-wet:#bf9a45;
  --iris:#3d8bfd; --iris-dk:#1f5fd1; --sweater:#34466e; --sweater-dk:#26355a; --tee:#f2f2ef;
  --display:"Young Serif",Georgia,"Times New Roman",serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --bar:clamp(24px,5vh,52px);
}
html,body{height:100%;overscroll-behavior:none}
body{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-text-size-adjust:100%}
body{background:var(--scene);color:var(--scene-text);font-family:var(--body);overflow:hidden}

/* ---------- Animation screen ---------- */
.screen{position:fixed;inset:0;overflow:hidden;background:var(--scene)}
#stage{position:absolute;inset:0;width:100%;height:100%;transition:transform .7s cubic-bezier(.3,.7,.2,1)}
.grain{position:absolute;inset:0;opacity:.07;pointer-events:none;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 40%,transparent 55%,rgba(0,0,0,.55))}
.bar{position:absolute;left:0;right:0;height:var(--bar);background:#000;z-index:2}
.bar.top{top:0}.bar.bottom{bottom:0}
.hud-top{position:absolute;z-index:3;top:calc(var(--bar) + 10px + env(safe-area-inset-top,0px));
  left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
  display:grid;gap:8px;pointer-events:none}
.hud-row{display:flex;justify-content:space-between;gap:12px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--scene-dim)}
.rec{display:flex;align-items:center;gap:8px}
.rec i{width:8px;height:8px;border-radius:50%;background:var(--bad);animation:blink-dot 1.2s steps(2) infinite}
@keyframes blink-dot{50%{opacity:.2}}
.caption{justify-self:center;max-width:36rem;text-align:center;font-family:var(--mono);font-size:12px;line-height:1.5;color:var(--scene-text);
  background:rgba(10,12,18,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:6px 12px;border-radius:10px;text-wrap:balance}
.caption.swap{animation:fadeup .5s ease}
@keyframes fadeup{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.reaction-bar{justify-self:center;width:min(180px,50vw);height:3px;background:rgba(255,255,255,.15);border-radius:2px;overflow:hidden;visibility:hidden}
.reaction-bar.on{visibility:visible}
.reaction-bar span{display:block;height:100%;background:var(--scene-text);transform-origin:left}

/* ---------- SVG character & props ---------- */
#stage *{transform-box:fill-box}
.skin{fill:var(--skin)} .skin-sh{fill:var(--skin-sh)}
.hair{fill:var(--hair);transition:fill .8s} .hair-hi{fill:var(--hair-hi);transition:fill .8s} .hair-sh{fill:var(--hair-sh)}
.sweater{fill:var(--sweater)} .sweater-dk{fill:var(--sweater-dk)}
.sleeve{stroke:var(--sweater);stroke-linecap:round;fill:none}
.wet .hair{fill:var(--hair-wet)} .wet .hair-hi{fill:var(--hair)}
.scene-layer{transition:opacity .7s}
#stage[data-scene="cafe"] .street-only{opacity:0}
#stage[data-scene="street"] .cafe-only{opacity:0}

#guy{transform-box:view-box;transform-origin:400px 860px;transition:transform .9s cubic-bezier(.3,.7,.2,1)}
#guyAnim{transform-box:view-box;transform-origin:400px 620px;animation:breathe 4s ease-in-out infinite}
#head{transition:transform .7s cubic-bezier(.3,.7,.2,1);transform-origin:50% 90%}
.kneel #guy{transform:translateY(150px)}
.runaway #guy{animation:flee 4.2s cubic-bezier(.5,0,.8,.6) forwards}
.close #guy{transform:translateY(70px) scale(1.12)}
.stepaside #guy{transform:translate(120px,-40px) scale(.9);transition-duration:1.6s}
.turnaway #head{transform:translateX(-14px) rotate(-9deg)}
.lookdown #head{transform:translateY(10px) rotate(7deg)}
.bob #guyAnim{animation:bob .45s ease-in-out 3}
.runaway #guyAnim{transform-origin:400px 860px;animation:fright .5s ease-out,runbob .24s ease-in-out .9s infinite}
.stumble #guyAnim{animation:stumble 1.1s ease-out}
.laughing #guyAnim{animation:laugh .2s ease-in-out infinite}
.walk #guyAnim{animation:walk .7s ease-in-out infinite}
.nod #guyAnim{animation:nod .7s ease-in-out 1.2s 2}
@keyframes flee{
  0%{transform:translate(0,-300px) scale(.4)}
  18%{transform:translate(0,-300px) scale(.4)}
  100%{transform:translate(720px,-300px) scale(.4)}}
@keyframes fright{0%{transform:none}40%{transform:translateY(-120px) scale(.95,1.08)}75%{transform:translateY(0) scale(1.08,.92)}100%{transform:none}}
@keyframes runbob{0%,100%{transform:rotate(9deg) translateY(0)}50%{transform:rotate(9deg) translateY(-50px)}}
.leg,.sarm{transform-origin:50% 0}
.runaway .legL,.walk .legL{animation:legswing .24s ease-in-out .9s infinite alternate}
.runaway .legR,.walk .legR{animation:legswing .24s ease-in-out .9s infinite alternate-reverse}
.runaway .armL{animation:armswing .24s ease-in-out .9s infinite alternate-reverse}
.runaway .armR{animation:armswing .24s ease-in-out .9s infinite alternate}
.walk .legL,.walk .legR{animation-duration:.35s;animation-delay:0s}
@keyframes legswing{from{transform:rotate(-30deg)}to{transform:rotate(30deg)}}
@keyframes armswing{from{transform:rotate(-40deg)}to{transform:rotate(40deg)}}
.handhead .armR,.wave .armR,.lighter .armR,.offer .armR,.reach .armR,.point .armL,.jacket .sidearms{opacity:0}
#alarm{opacity:0;transform:scale(.3);transform-origin:50% 100%}
.runaway #alarm{animation:alarm 1.2s ease-out forwards}
@keyframes alarm{0%{opacity:0;transform:scale(.3)}15%{opacity:1;transform:scale(1.2)}30%{transform:scale(1)}80%{opacity:1}100%{opacity:0}}
#zoom{transform-box:view-box;transform-origin:400px 300px;will-change:transform}
#hand{transform-box:view-box;transform-origin:400px 300px}
.runaway #zoom{animation:pullback 4.2s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes pullback{0%{transform:scale(1.18);opacity:.2}8%{opacity:1}100%{transform:scale(.94)}}
.chase #dog{animation:chase 4.2s cubic-bezier(.55,0,.75,.8) forwards}
@keyframes chase{
  0%{transform:translate(262px,548px) scale(.42)}
  22%{transform:translate(262px,548px) scale(.42)}
  30%{transform:translate(280px,536px) scale(.42)}
  100%{transform:translate(960px,548px) scale(.42)}}
.chase #dog > g{animation:dogbob .2s ease-in-out .9s infinite alternate}
@keyframes dogbob{to{transform:translateY(-14px) rotate(-4deg)}}
.dleg{transform-origin:50% 0}
.chase .dleg{animation:dstride .1s linear .9s infinite alternate}
.dleg:nth-of-type(2n){animation-direction:alternate-reverse!important}
.dog-side .dleg,.dog-near .dleg,.dog-close .dleg{animation:dstride .14s linear 8 alternate}
@keyframes dstride{from{transform:rotate(-28deg)}to{transform:rotate(28deg)}}
.chase #bark{opacity:1}
#dust circle{opacity:0}
.runaway #dust circle{animation:dust .6s ease-out 1s infinite}
#dust circle:nth-child(2){animation-delay:1.2s!important}#dust circle:nth-child(3){animation-delay:1.4s!important}
@keyframes dust{0%{opacity:.6;transform:scale(.4)}100%{opacity:0;transform:scale(1.6) translateX(-40px)}}
#stage[data-e="open"] .pupil{animation:look 7s ease-in-out infinite}
@keyframes look{0%,40%,100%{transform:none}45%,58%{transform:translateX(4px)}63%,75%{transform:translate(-3px,1px)}}
@keyframes breathe{50%{transform:translateY(2px) scaleY(.995)}}
@keyframes bob{50%{transform:translateY(-10px)}}
@keyframes hop{50%{transform:translateY(-16px) rotate(-3deg)}}
@keyframes stumble{0%{transform:none}25%{transform:rotate(-8deg) translate(-20px,24px)}45%{transform:rotate(5deg) translate(8px,8px)}70%{transform:rotate(-2deg)}100%{transform:none}}
@keyframes laugh{50%{transform:translateY(-5px) rotate(1deg)}}
@keyframes walk{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-9px) rotate(1.5deg)}}
@keyframes nod{50%{transform:translateY(6px)}}

/* Face */
.mouth{opacity:0;transition:opacity .2s}
#stage[data-m="neutral"] .m-neutral,#stage[data-m="smile"] .m-smile,#stage[data-m="frown"] .m-frown,
#stage[data-m="o"] .m-o,#stage[data-m="laugh"] .m-laugh,#stage[data-m="smirk"] .m-smirk{opacity:1}
.eye{transition:transform .25s;transform-origin:center}
.blink{transform-origin:center;animation:blink 4.6s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.pupil{transition:transform .35s}
#stage[data-e="squint"] .eye{transform:scaleY(.5)}
#stage[data-e="closed"] .eye{transform:scaleY(.1)}
#stage[data-e="wide"] .eye{transform:scale(1.2)}
#stage[data-e="side"] .pupil{transform:translateX(-5px)}
#stage[data-e="down"] .pupil{transform:translateY(3px)}
.brow{transition:transform .3s;transform-origin:center}
#stage[data-b="raised"] .brow{transform:translateY(-7px)}
#stage[data-b="sad"] .brow-l{transform:rotate(-15deg) translateY(-2px)}
#stage[data-b="sad"] .brow-r{transform:rotate(15deg) translateY(-2px)}
.blush{opacity:0;transition:opacity .4s}
#stage[data-bl="1"] .blush{opacity:.65}

/* Props */
.prop{opacity:0;transition:opacity .4s}
.wave #handWave,.handhead #handHead,.point #handPoint,.cig #cig,.smoke #smoke,.lighter #lighter,.drips #drips,.pet #petHand,.bark #bark,.cup-on #hisCup{opacity:1}
#handWave .arm{transform-origin:50% 100%;animation:wave .6s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-8deg)}to{transform:rotate(10deg)}}
#handHead .arm{transform-origin:50% 100%;animation:scratch .25s ease-in-out infinite alternate}
@keyframes scratch{to{transform:rotate(4deg)}}
#petHand .rub{animation:rub .5s ease-in-out infinite alternate}
@keyframes rub{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
#smoke path{animation:smoke 2.6s ease-out infinite;opacity:0}
#smoke path:nth-child(2){animation-delay:.9s}#smoke path:nth-child(3){animation-delay:1.7s}
@keyframes smoke{0%{opacity:0;transform:translateY(0) scale(.6)}20%{opacity:.7}100%{opacity:0;transform:translate(14px,-90px) scale(1.6)}}
.cigout #cig{animation:cigout 1.5s ease-in .7s forwards}
.cigout #smoke{animation:fadeout 1s .7s forwards}
@keyframes cigout{to{transform:translate(30px,110px) rotate(50deg);opacity:0}}
@keyframes fadeout{to{opacity:0}}
.flame{transform-origin:50% 100%;animation:flicker .12s ease-in-out infinite alternate}
@keyframes flicker{to{transform:scale(.85,1.12)}}
#drips ellipse{animation:drip 1.1s ease-in infinite}
#drips ellipse:nth-child(2){animation-delay:.4s}#drips ellipse:nth-child(3){animation-delay:.75s}
@keyframes drip{from{transform:translateY(0);opacity:1}to{transform:translateY(70px);opacity:0}}
#bark path{animation:barkpulse .35s ease-in-out infinite alternate}
@keyframes barkpulse{to{transform:scale(1.25);opacity:.4}}

#dog{transform-box:view-box;transform-origin:0 0;transform:translate(-260px,520px);transition:transform 1.1s cubic-bezier(.3,.7,.2,1)}
.dog-side #dog{transform:translate(292px,548px)}
.dog-near #dog{transform:translate(318px,548px)}
.dog-close #dog{transform:translate(300px,598px) scale(1.5)}
#tail{transform-origin:100% 100%;animation:wag .22s ease-in-out infinite alternate}
@keyframes wag{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}

#rain,#rainShade{opacity:0;transition:opacity .6s}
.rain #rain{opacity:1}.rain #rainShade{opacity:.45}
#rain line{animation:fall .55s linear infinite}
@keyframes fall{from{transform:translate(0,-140px)}to{transform:translate(-30px,720px)}}

#jacket{transform-box:view-box;transform:translateY(-260px);transition:transform .9s cubic-bezier(.3,.7,.2,1) .25s}
.jacket #jacket{transform:none}
#reach,#offer{opacity:0;transform-box:view-box;transform:translate(40px,220px);transition:transform .7s cubic-bezier(.3,.7,.2,1) .2s,opacity .4s .2s}
.reach #reach,.offer #offer{opacity:1;transform:none}
#roof{transform-box:view-box;transform:translateY(-180px);transition:transform .7s cubic-bezier(.3,.7,.2,1)}
.roof #roof{transform:none;transition-delay:1.6s}
#cam{transform-box:view-box;transform-origin:400px 300px}
.camrun #cam{animation:camrun .16s ease-in-out 10 alternate}
@keyframes camrun{from{transform:translate(-6px,4px) scale(1.04)}to{transform:translate(6px,-6px) scale(1.06)}}
.pop{opacity:0;transform:scale(.3);transform-origin:center;transition:opacity .25s,transform .35s cubic-bezier(.3,1.6,.5,1)}
#swear,#haha{display:none}
.haha #haha text{animation:hahabob .3s ease-in-out infinite alternate}
@keyframes hahabob{to{transform:translateY(-6px)}}
.steam path{animation:steam 3s ease-in-out infinite;opacity:0}
.steam path:nth-child(2){animation-delay:1.4s}
@keyframes steam{0%{opacity:0;transform:translateY(0)}30%{opacity:.5}100%{opacity:0;transform:translateY(-34px)}}
.bokeh circle{animation:twinkle 5s ease-in-out infinite alternate}
.bokeh circle:nth-child(2n){animation-delay:-2s}.bokeh circle:nth-child(3n){animation-delay:-3.5s}
@keyframes twinkle{to{opacity:.25}}

/* ---------- White bubble ---------- */
.dock{position:fixed;z-index:5;left:0;right:0;bottom:0;display:flex;justify-content:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:calc(var(--bar) + 12px + env(safe-area-inset-bottom,0px))}
.bubble{width:min(560px,100%);background:var(--paper);color:var(--ink);border-radius:26px;padding:20px 20px 18px;
  box-shadow:0 30px 80px -20px rgba(0,0,0,.65);display:grid;gap:14px;
  transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .35s;max-height:calc(100dvh - 150px);overflow:auto}
.bubble.hide{transform:translateY(120%) scale(.94);opacity:0;pointer-events:none}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;font-weight:600;color:var(--ink-soft);letter-spacing:.06em;text-transform:uppercase}
.part{color:var(--accent)}
.count{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:0}
.q{font-family:var(--display);font-weight:400;font-size:clamp(1.15rem,3.4vw,1.45rem);line-height:1.3;text-wrap:balance;margin:0}
.timer{display:grid;gap:5px}
.track{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.fill{height:100%;background:var(--accent);border-radius:6px;transform-origin:left}
.fill.low{background:var(--bad)}
.secs{font-family:var(--mono);font-size:11px;color:var(--ink-soft);font-variant-numeric:tabular-nums;justify-self:end}
.opts{display:grid;gap:8px}
.opts.cols{grid-template-columns:repeat(auto-fit,minmax(100px,1fr))}
.opt{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:15px;
  background:#f4f5f9;border:1.5px solid transparent;font-weight:600;font-size:15px;color:var(--ink);line-height:1.3;transition:background .15s,border-color .15s,transform .1s}
.opt:hover{background:#eaf0ff;border-color:#c9d8ff}
.opt:active{transform:scale(.98)}
.opt:focus-visible{border-color:var(--accent);outline:3px solid #c9d8ff}
.key{flex:none;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:var(--paper);border:1px solid var(--line);font-family:var(--mono);font-size:11px;color:var(--ink-soft)}
.btn{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;padding:14px 18px;border-radius:15px;background:var(--ink);color:var(--paper);font-weight:700;font-size:15px}
.btn:focus-visible{outline:3px solid #c9d8ff}
.btn.ghost{background:#f4f5f9;color:var(--ink)}
.lede{margin:0;color:var(--ink-soft);font-size:15px;line-height:1.55}
.summary{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.summary li{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:start;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.summary .n{font-family:var(--mono);font-size:11px;color:var(--ink-soft);padding-top:2px}
.summary .qq{color:var(--ink-soft);min-width:0}
.summary .qq b{display:block;color:var(--ink);font-weight:600}
.mark{font-weight:700;font-size:12px;padding:3px 8px;border-radius:999px;white-space:nowrap}
.mark.ok{background:#e3f6ec;color:var(--good)}.mark.no{background:#fbe6e6;color:var(--bad)}.mark.act{background:#eef1f8;color:var(--ink-soft)}
.score{display:flex;align-items:baseline;gap:8px}
.score strong{font-family:var(--display);font-size:2.3rem;font-weight:400;font-variant-numeric:tabular-nums}
.score span{color:var(--ink-soft);font-size:14px}
.final{margin:0;font-family:var(--display);font-size:1.08rem;line-height:1.45;text-wrap:balance}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* Added scenes: anger, passerby, hearts, lightning */
#stage[data-b="angry"] .brow-l{transform:rotate(16deg) translateY(3px)}
#stage[data-b="angry"] .brow-r{transform:rotate(-16deg) translateY(3px)}
#flush,#anger{opacity:0;transition:opacity .4s}
.angry #flush{opacity:.35;transition-delay:.8s}
.angry #anger{opacity:1;transition-delay:.8s;animation:throb .4s ease-in-out .8s infinite alternate}
#anger{transform-origin:center}
@keyframes throb{to{transform:scale(1.2)}}
#passer{transform-box:view-box;transform:translateX(900px);opacity:0}
.passer #passer{opacity:1;animation:passby 2.4s cubic-bezier(.4,0,.6,1) forwards}
#passer .legs{transform-origin:50% 0;animation:stride .3s ease-in-out infinite alternate}
@keyframes stride{from{transform:skewX(-8deg)}to{transform:skewX(8deg)}}
@keyframes passby{0%{transform:translateX(900px)}100%{transform:translateX(-900px)}}
.passer.stumble #guyAnim{animation:stumble 1.1s ease-out .85s}
.passer.swear #swear{transition-delay:1.15s}
.hearts #hearts path{animation:heart 2.4s ease-out forwards}
#hearts path{opacity:0;transform-origin:center}
#hearts path:nth-child(2){animation-delay:.25s!important}#hearts path:nth-child(3){animation-delay:.5s!important}
#hearts path:nth-child(4){animation-delay:.7s!important}#hearts path:nth-child(5){animation-delay:.95s!important}
@keyframes heart{0%{opacity:0;transform:translateY(20px) scale(.3)}20%{opacity:1;transform:translateY(0) scale(1.1)}100%{opacity:0;transform:translateY(-120px) scale(.9) rotate(12deg)}}
#flash{opacity:0;pointer-events:none}
.flash #flash{animation:flash 2.6s ease-out}
@keyframes flash{0%,100%{opacity:0}6%{opacity:.85}10%{opacity:.1}14%{opacity:.6}30%{opacity:0}}
#bolt{opacity:0}
.flash #bolt{animation:flash 2.6s ease-out}
/* v5: cinematic pass + new scenes */
.bgblur{filter:blur(var(--bgb,2px));transition:filter .9s ease}
#motes circle{animation:mote 9s ease-in-out infinite alternate;opacity:.0}
#stage[data-scene="cafe"] #motes circle{opacity:.55}
@keyframes mote{from{transform:translate(0,0)}to{transform:translate(40px,-60px)}}
#puddles{opacity:0;transition:opacity 1s}
.rain #puddles{opacity:1}
#puddles ellipse{animation:ripple 1.4s ease-out infinite;transform-origin:center}
#puddles ellipse:nth-child(2n){animation-delay:.5s}#puddles ellipse:nth-child(3n){animation-delay:.9s}
@keyframes ripple{from{transform:scale(.2);opacity:.9}to{transform:scale(1.4);opacity:0}}
.hairsway{transform-origin:50% 100%;animation:sway 5s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(1.2deg) translateX(1px)}}
.walk .hairsway,.runaway .hairsway,.laughing .hairsway{animation-duration:.5s}

@keyframes pushin{from{transform:scale(1)}to{transform:scale(1.07) translateY(10px)}}

@keyframes pullout{from{transform:scale(1.04)}to{transform:scale(.98)}}
.fadecut{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:2;transition:opacity .28s}
.fadecut.on{opacity:1}
.letter{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(255,170,90,.08),transparent 40%,rgba(30,60,140,.10))}
/* slip */
.slip #cam{animation:slip 1.3s cubic-bezier(.3,.7,.2,1) forwards}
@keyframes slip{0%{transform:none}35%{transform:rotate(-13deg) translate(-30px,80px)}100%{transform:rotate(-4deg) translate(-8px,26px)}}
.caught #cam{animation:caught 1.4s cubic-bezier(.3,.7,.2,1) forwards}
@keyframes caught{0%{transform:rotate(-4deg) translate(-8px,26px)}25%{transform:rotate(-9deg) translate(-16px,60px)}100%{transform:none}}
.fell #cam{animation:fell 1s cubic-bezier(.5,0,.8,.5) forwards}
@keyframes fell{0%{transform:rotate(-4deg) translate(-8px,26px)}100%{transform:rotate(-16deg) translate(-40px,150px)}}
#catch{opacity:0;transform-box:view-box;transform:translate(0,260px);transition:transform .45s cubic-bezier(.3,1.3,.5,1) .15s,opacity .2s .15s}
.caught #catch{opacity:1;transform:none}
#phone{opacity:0;transition:opacity .3s .5s}
.photo #phone{opacity:1}
.photo #flash{animation:camflash .5s ease-out 1.3s 2}
@keyframes camflash{0%{opacity:0}10%{opacity:.9}100%{opacity:0}}
/* ice cream */
#cart{opacity:0;transition:opacity .6s}
.cart #cart{opacity:1}
#hisCone,#yourCone,#giveCone{opacity:0;transition:opacity .4s .2s}
.hiscone #hisCone,.yourcone #yourCone{opacity:1}
.givecone #giveCone{opacity:1;transform-box:view-box;animation:give .9s cubic-bezier(.3,.7,.2,1) .3s both}
@keyframes give{from{transform:translateY(240px)}to{transform:none}}
.lick #hisCone .scoop{animation:lick .5s ease-in-out .6s 4 alternate}
@keyframes lick{to{transform:translate(-14px,10px) rotate(-8deg)}}
#yourCone .bitten{opacity:0;transition:opacity .1s 1.5s}
.bite #yourCone .bitten{opacity:1}
.bite #yourCone .full{opacity:1;transition:opacity .1s 1.5s}
.bite #yourCone .full{opacity:0}
.bite #guy{transform:translate(40px,30px) scale(1.06);transition:transform .9s cubic-bezier(.3,.7,.2,1) .3s}
.bite #yourCone{transform-box:view-box;animation:offerup 3s cubic-bezier(.3,.7,.2,1) forwards}
@keyframes offerup{0%{transform:none}35%,62%{transform:translate(-108px,-168px) rotate(-12deg)}100%{transform:translate(-10px,-10px)}}
.bite #yourCone .bitten,.bite #yourCone .full{transition-delay:1.25s}
#talk{display:none}
/* v6: cinema layer */
.grade{position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light;background:var(--grade,transparent);opacity:var(--gradeo,0);transition:background 1.2s,opacity 1.2s}
.desat{position:absolute;inset:0;pointer-events:none;mix-blend-mode:saturation;background:#808080;opacity:0;transition:opacity 1s}
.screen.sadgrade .desat{opacity:.38}
.leak{position:absolute;inset:-20%;pointer-events:none;mix-blend-mode:screen;opacity:0;
  background:radial-gradient(30% 45% at 50% 50%,rgba(255,170,80,.75),rgba(255,90,60,.25) 50%,transparent 75%)}
.screen.leakon .leak{animation:leak 2.8s ease-out}
@keyframes leak{0%{opacity:0;transform:translateX(-45%) skewX(-12deg)}30%{opacity:.85}100%{opacity:0;transform:translateX(45%) skewX(-12deg)}}
.ots{position:absolute;left:-10vw;bottom:-6vh;width:min(48vw,420px);height:72vh;pointer-events:none;filter:blur(14px);
  opacity:0;transform:translateX(-30%);transition:opacity .7s,transform .9s cubic-bezier(.3,.7,.2,1)}
.ots::before{content:"";position:absolute;left:18%;top:8%;width:62%;height:44%;border-radius:50% 50% 46% 46%;background:#2a1d18}
.ots::after{content:"";position:absolute;left:-6%;top:44%;width:120%;height:70%;border-radius:48% 48% 0 0;background:#1d2130}
.screen.otson .ots{opacity:.92;transform:none}
.titlecard{position:absolute;inset:0;z-index:4;display:grid;place-items:center;align-content:center;gap:14px;background:#000;color:#f3efe6;
  text-align:center;padding-inline:max(24px,env(safe-area-inset-left,0px));opacity:0;pointer-events:none;transition:opacity .6s}
.titlecard.on{opacity:1}
.titlecard small{font-family:var(--mono);font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--warm)}
.titlecard h2{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(2rem,8vw,4.2rem);line-height:1.05;text-wrap:balance;letter-spacing:.01em}
.titlecard.on h2{animation:titlein 2.2s cubic-bezier(.2,.7,.2,1) both}
.titlecard.on small{animation:titlein 2.2s cubic-bezier(.2,.7,.2,1) .25s both}
@keyframes titlein{from{opacity:0;letter-spacing:.25em;filter:blur(6px)}to{opacity:1;filter:none}}
.bar{transition:height 1.2s cubic-bezier(.3,.7,.2,1)}
.screen.wide .bar{height:calc(var(--bar) * 1.8)}
.tc{font-variant-numeric:tabular-nums}
.snd{all:unset;pointer-events:auto;cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--scene-text);
  border:1px solid rgba(255,255,255,.3);padding:3px 8px;border-radius:999px}
.snd:focus-visible{outline:2px solid var(--warm)}
.hud-right{display:flex;gap:12px;align-items:center}
@media (max-width:560px){#loc{display:none}}
@media (max-width:380px){.tc{display:none}}
.focusring{position:absolute;pointer-events:none;width:64px;height:64px;border:1.5px solid rgba(255,255,255,.7);border-radius:6px;opacity:0;
  transform:translate(-50%,-50%) scale(1.4);transition:opacity .2s}
.focusring.on{animation:focus .9s ease-out}
@keyframes focus{0%{opacity:0;transform:translate(-50%,-50%) scale(1.5)}30%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
#stage[data-m="smile"]:not(.turnaway):not(.lookdown) #head{transform:rotate(3deg)}
#stage[data-e="wide"] .brow{transform:translateY(-8px)}
.laughing #head{animation:headlaugh .22s ease-in-out infinite alternate}
@keyframes headlaugh{to{transform:rotate(-4deg) translateY(-3px)}}
.rimlight{mix-blend-mode:screen;opacity:.55}
#stage[data-scene="street"] .rimlight{opacity:.35}
/* v7 */
.nightsky{opacity:calc(var(--night,0) * .72);transition:opacity 2.5s}
#stars{opacity:var(--night,0);transition:opacity 2.5s}
#stars circle{animation:twinkle 3s ease-in-out infinite alternate}
.streetlamp{opacity:calc(.45 + var(--night,0) * .55);transition:opacity 2.5s}
.eyetrack{transition:transform .25s ease-out;transform:translate(var(--px,0px),var(--py,0px))}
#stage[data-e="closed"] .eyetrack{transform:none}
#nosecream{opacity:0}
.bite #nosecream{opacity:1;transition:opacity .15s 1.45s}
.cuphand{opacity:0}
.idle-sip #hisCup{transform-box:view-box;transform-origin:260px 436px;animation:sip 2.6s ease-in-out}
.idle-sip .cuphand{opacity:1}
@keyframes sip{0%,100%{transform:none}30%,70%{transform:translate(132px,-196px) rotate(-22deg)}}
#stage.idle-sip #head{transform:rotate(-3deg) translateY(4px)}
#stage.idle-phone #phone{opacity:1}
#stage.idle-phone .pupil{animation:none;transform:translateY(4px)}
#stage.idle-phone #head{transform:rotate(5deg) translateY(6px)}
#stage.idle-phone .armR{opacity:0}
#stage.idle-hair #handHead{opacity:1}
#stage.idle-hair .armR{opacity:0}
#stage.idle-look .pupil{animation:none;transform:translateX(6px)}
#stage.idle-look #head{transform:translateX(8px) rotate(4deg)}
#stage.idle-tap .taphand{animation:tap .18s ease-in-out infinite alternate}
#stage.idle-tap .taphand:nth-of-type(2){animation-delay:.09s}
@keyframes tap{to{transform:translateY(-7px)}}
#stage.standup #guy{transform:translateY(-110px) scale(1.04);transition:transform 1.4s cubic-bezier(.4,0,.2,1)}
.fx{position:absolute;inset:0;pointer-events:none;z-index:2}
.pop2{position:absolute;opacity:0;transform:scale(.3) rotate(-8deg);transition:opacity .2s,transform .4s cubic-bezier(.3,1.6,.5,1)}
.pop-swear{right:max(10%,16px);top:30%;background:#fff;color:#1b1d26;font:700 clamp(18px,4.5vw,26px)/1 var(--mono);padding:16px 20px;
  clip-path:polygon(0 20%,12% 0,24% 14%,40% 0,52% 14%,70% 0,80% 16%,100% 8%,92% 34%,100% 56%,86% 66%,96% 92%,72% 84%,58% 100%,44% 84%,24% 100%,20% 78%,0 84%,8% 58%,0 40%)}
.pop-haha{left:50%;top:26%;font:400 clamp(34px,10vw,60px)/1 var(--display);color:#ffd27a;-webkit-text-stroke:2px #14161d;text-shadow:3px 3px 0 #14161d;white-space:nowrap}
.screen.fx-swear .pop-swear{opacity:1;transform:rotate(-4deg);transition-delay:.45s}
.screen.fx-swear.fx-late .pop-swear{transition-delay:1.15s}
.screen.fx-haha .pop-haha{opacity:1;transform:translateX(-50%) rotate(-6deg);animation:hahabob2 .3s ease-in-out .4s infinite alternate}
@keyframes hahabob2{to{transform:translateX(-50%) translateY(-8px) rotate(4deg)}}
.lens{position:absolute;inset:0;pointer-events:none;z-index:2;opacity:0;transition:opacity .8s}
.screen.lensrain .lens{opacity:1}
.lens i{position:absolute;width:var(--s);height:calc(var(--s) * 1.2);border-radius:50% 50% 48% 48%;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.55),rgba(170,200,255,.12) 45%,rgba(20,30,60,.18) 70%,transparent 72%);
  box-shadow:inset -1px -2px 3px rgba(255,255,255,.25);animation:slide var(--d) linear var(--w) infinite}
@keyframes slide{0%{transform:translateY(0)}60%{transform:translateY(8px)}100%{transform:translateY(46vh);opacity:0}}
.coat{position:absolute;inset:0;pointer-events:none;z-index:1;background:radial-gradient(120% 80% at 50% 110%,transparent 40%,rgba(5,8,20,.65));opacity:0;transition:opacity .9s .3s}
.screen.undercoat .coat{opacity:1}
.smokefx{position:absolute;left:-30%;top:10%;width:90%;height:60%;pointer-events:none;z-index:2;opacity:0;filter:blur(30px);
  background:radial-gradient(closest-side,rgba(220,224,235,.55),transparent)}
.screen.smokeon .smokefx{animation:smokepass 3s ease-in-out .6s}
@keyframes smokepass{0%{opacity:0;transform:translateX(0)}40%{opacity:1}100%{opacity:0;transform:translateX(90%)}}
.pulse{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.pulse b{display:inline-block;width:11px;height:10px;background:#ff5c7a;clip-path:path("M5.5 10 L0.8 5 A2.6 2.6 0 0 1 5.5 1.6 A2.6 2.6 0 0 1 10.2 5Z");animation:beat var(--beat,.83s) ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.35)}30%{transform:scale(1)}45%{transform:scale(1.2)}}
.bpmchart{display:grid;gap:4px}
.bpmchart small{font-size:12px;color:var(--ink-soft);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.bpmchart svg{width:100%;height:56px;display:block}
.music{pointer-events:auto;color:var(--scene-text);text-decoration:none;font-family:var(--mono);font-size:11px;letter-spacing:.12em;border:1px solid rgba(255,255,255,.3);padding:3px 8px;border-radius:999px}
.music:focus-visible{outline:2px solid var(--warm)}
@media (max-width:460px){.music .mlabel{display:none}}

/* v8: telefon */
.dock{pointer-events:none}
.bubble{pointer-events:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.opt{min-height:48px}
.fs{all:unset;pointer-events:auto;cursor:pointer;font-family:var(--mono);font-size:12px;color:var(--scene-text);border:1px solid rgba(255,255,255,.3);padding:2px 8px;border-radius:999px}
.fs:focus-visible{outline:2px solid var(--warm)}
@media (max-width:600px){
  .hud-top{gap:6px}
  .hud-row{font-size:10px;letter-spacing:.08em}
  .hud-right{gap:8px}
  .caption{font-size:11px;padding:5px 10px;line-height:1.45}
  .bubble{border-radius:22px;padding:16px 16px 14px;gap:12px}
  .opt{font-size:15px;padding:11px 12px}
  .lede{font-size:14px}
  .bgblur{filter:blur(min(var(--bgb,2px),2px))}
}
@media (max-width:360px){
  .opts.cols{grid-template-columns:1fr}
  .q{font-size:1.08rem}
}
/* yatay telefon: soru kartı sağda, sahne solda */
@media (orientation:landscape) and (max-height:520px){
  :root{--bar:12px}
  .dock{top:0;align-items:center;justify-content:flex-end;
    padding-top:calc(var(--bar) + 8px + env(safe-area-inset-top,0px));padding-bottom:calc(var(--bar) + 8px + env(safe-area-inset-bottom,0px))}
  .bubble{width:min(420px,46vw);max-height:calc(100dvh - var(--bar)*2 - 24px);padding:12px 14px;gap:9px;border-radius:18px}
  .bubble.hide{transform:translateX(120%)}
  .q{font-size:1rem}
  .opt{min-height:40px;padding:8px 12px;font-size:14px}
  .opts{gap:6px}
  .lede{font-size:13px;line-height:1.45}
  .btn{padding:11px 16px}
  .caption{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(var(--bar) + 10px + env(safe-area-inset-bottom,0px));max-width:min(44vw,28rem);text-align:left;font-size:10.5px}
  .reaction-bar{justify-self:start}
  .summary li{padding:6px 0}
  .score strong{font-size:1.8rem}
  .titlecard h2{font-size:clamp(1.8rem,7vh,3rem)}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

const Snd = {
  ctx:null, on:true, amb:null, ambType:null,
  init(){ try { this.ctx = this.ctx || new (window.AudioContext || window.webkitAudioContext)(); this.ctx.resume(); } catch(e){} },
  tone(freq, dur, type="sine", vol=.15, when=0, slide=0){
    if (!this.on || !this.ctx) return;
    const c = this.ctx, t = c.currentTime + when, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(freq*slide, t+dur);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t+.015); g.gain.exponentialRampToValueAtTime(.0001, t+dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur+.05);
  },
  noise(dur, vol, filt, freq){
    if (!this.on || !this.ctx) return null;
    const c = this.ctx, n = c.sampleRate*dur, b = c.createBuffer(1, n, c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random()*2-1;
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = b; f.type = filt; f.frequency.value = freq; g.gain.value = vol;
    s.connect(f).connect(g).connect(c.destination); return {s, g};
  },
  right(){ [660, 880, 1320].forEach((f,i) => this.tone(f, .5, "sine", .12, i*.09)); },
  wrong(){ this.tone(330, .5, "triangle", .14, 0, .6); this.tone(247, .6, "triangle", .1, .18, .7); },
  tick(){ this.tone(1200, .05, "square", .04); },
  click(){ this.tone(520, .06, "triangle", .08); },
  whoosh(){ const n = this.noise(.6, .18, "bandpass", 900); if (n){ n.s.start(); n.g.gain.exponentialRampToValueAtTime(.001, this.ctx.currentTime+.6); } },
  thunder(){ const n = this.noise(2.2, .5, "lowpass", 180); if (n){ n.s.start(this.ctx.currentTime+.15); n.g.gain.exponentialRampToValueAtTime(.001, this.ctx.currentTime+2.3); } },
  bark(){ [0,.32,.62].forEach(w => this.tone(380, .12, "sawtooth", .07, w, .55)); },
  shutter(){ const n = this.noise(.08, .3, "highpass", 2000); if (n) n.s.start(this.ctx.currentTime+1.3); },
  ambience(type){
    if (this.ambType === type) return;
    this.ambType = type;
    if (this.amb){ try { this.amb.g.gain.linearRampToValueAtTime(0, this.ctx.currentTime+.8); this.amb.s.stop(this.ctx.currentTime+.9); } catch(e){} this.amb = null; }
    if (!this.on || !this.ctx || !type) return;
    const conf = {cafe:[.035,"lowpass",500], street:[.03,"lowpass",300], rain:[.11,"highpass",1400], rainsoft:[.09,"lowpass",520]}[type];
    const n = this.noise(4, 0, conf[1], conf[2]); if (!n) return;
    n.s.loop = true; n.s.start(); n.g.gain.linearRampToValueAtTime(conf[0], this.ctx.currentTime+1); this.amb = n;
  }
};

// Duruma göre kamera, renk ve ses seçimi
function direct(st){
  const t = st.tags || [], has = x => t.includes(x);
  shake = has("runaway") || has("camrun") ? 2.2 : has("rain") || has("walk") ? 1.2 : .6;
  let shot = st.shot;
  if (!shot){
    if (has("runaway")) shot = null;
    else if (has("dog-side") || has("dog-near") || has("dog-close")) shot = has("dog-close") || has("kneel") ? "medium" : "wide";
    else if (has("cart") && !has("bite") && !has("givecone") && !has("hiscone")) shot = "medium";
    else if (has("slip") || has("fell") || has("caught")) shot = "wide";
    else if (has("bite") || has("givecone") || has("jacket") || has("offer")) shot = "medium";
    else if (st.face === "surprised" || st.face === "panic" || st.face === "angry") shot = "snap";
    else if (["happy","laugh","soft"].includes(st.face)) shot = "cu";
    else if (["sad","embarrassed"].includes(st.face)) shot = "dutch";
    else if (st.face === "sheepish") shot = "mcu";
    else if (has("walk") || has("stepaside") || has("kneel")) shot = "low";
    else shot = "medium";
  }
  if (shot) camera(shot);
  screenEl.classList.toggle("fx-swear", has("swear"));
  screenEl.classList.toggle("fx-late", has("passer"));
  screenEl.classList.toggle("fx-haha", has("haha"));
  screenEl.classList.toggle("lensrain", has("rain") && !has("jacket") && !has("roof"));
  screenEl.classList.toggle("undercoat", has("jacket"));
  screenEl.classList.remove("smokeon"); void screenEl.offsetWidth;
  if (has("smoke") && !has("stepaside")) screenEl.classList.add("smokeon");
  const sad = ["sad","embarrassed"].includes(st.face);
  grade(has("rain") ? "rain" : sad ? "sad" : (st.face === "happy" || has("hearts")) && st.scene === "cafe" ? "happy" : st.scene, sad);
  if (has("hearts") || (st.face === "happy" && !st.isAsk)) leak();
  Snd.ambience(has("rain") ? (has("jacket") || has("roof") ? "rainsoft" : "rain") : st.scene);
  if (has("flash")) Snd.thunder();
  if (has("chase") || has("bark") || has("dog-side")) Snd.bark();
  if (has("photo")) Snd.shutter();
  if (shot === "snap" || has("runaway") || has("slip")) Snd.whoosh();
}

let lift = 0, shiftX = 0;
const landMQ = matchMedia("(orientation: landscape) and (max-height: 520px)");
function applyLift(){
  if (bubble.classList.contains("hide")) { lift = 0; shiftX = 0; stage.style.transform = ""; return; }
  if (landMQ.matches){
    lift = 0;
    const head = $("head").getBoundingClientRect(), br = bubble.getBoundingClientRect();
    const headCx = head.left + head.width/2 - shiftX;
    shiftX = Math.min(0, br.left/2 + 8 - headCx);
    stage.style.transform = shiftX ? `translateX(${shiftX}px)` : "";
    return;
  }
  shiftX = 0;
  const face = $("mouthAnchor").getBoundingClientRect();
  const head = $("head").getBoundingClientRect();
  const cap = $("caption").getBoundingClientRect();
  const pad = parseFloat(getComputedStyle($("dock")).paddingBottom);
  const bubbleTop = innerHeight - pad - bubble.offsetHeight;
  const mouthBottom = face.bottom + lift, headTop = head.top + lift;
  const need = mouthBottom + 22 - bubbleTop;
  const maxLift = Math.max(0, headTop - cap.bottom - 10);
  lift = Math.max(0, Math.min(need, maxLift));
  stage.style.transform = lift ? `translateY(${-lift}px)` : "";
}
addEventListener("resize", () => requestAnimationFrame(applyLift));

    return;
  }
  setState({scene:"cafe", face:"happy", tags:["cup-on","wave"], shot:"ask", text:"Video: Altın saatte sıcacık bir kafe. Sarı saçlı, mavi gözlü genç bir adam seni masasına çağırıyor."});
  $("sceneNo").textContent = "00"; $("loc").textContent = "Kafe · Masa 4";
  bubble.innerHTML = `
    <div class="meta"><span class="part">İlk buluşma · 12 soru</span><span class="count">~3 dk</span></div>
    <h1 class="q">Kahve soğumadan beni ne kadar iyi tanıyabilirsin?</h1>
    <p class="lede">Önce masada kim olduğumla ilgili altı soru, sonra dışarıda altı an. Her soru için ${ROUND_SECONDS} saniyen var.</p>
    <button class="btn" id="start">Masaya otur</button>`;
  showBubble();
  $("start").onclick = () => { Snd.init(); Snd.click(); musicStart(); idx = 0; answers = []; showQuestion(); };
}

function showQuestion(){
  const Q = QUESTIONS[idx];
  if (Q.part === 2 && QUESTIONS[idx-1] && QUESTIONS[idx-1].part === 1 && !Q._carded){
    Q._carded = true; bubble.classList.add("hide");
    setState({scene:"cafe", face:"happy", tags:["cup-on","standup"], shot:"medium", text:"Video: Hesabı ödeyip kalkıyorsunuz. Adam ceketini alıp kapıyı senin için açıyor."});
    setTimeout(() => { Snd.whoosh(); titleCard("2. Bölüm", "Dışarıda", 2000, showQuestion); }, 1900);
    return;
  }
  const k2 = QUESTIONS.slice(0, idx).filter(q => q.part === 2).length, n2 = QUESTIONS.filter(q => q.part === 2).length;
  stage.style.setProperty("--night", Q.part === 2 ? (k2 / n2 * .85).toFixed(2) : 0);
  Q._carded = false;
  locked = false;
  $("sceneNo").textContent = String(idx+1).padStart(2,"0");
  $("loc").textContent = Q.part === 1 ? "Kafe · Masa 4" : "Dışarıda · " + Q.tag;
  const askSt = Q.part === 1 ? {...TABLE.ask, talk:true, isAsk:true, shot: idx % 2 ? "ots" : "ask"} : {...Q.ask, isAsk:true};
  const prevScene = stage.dataset.scene;
  if (askSt.scene !== prevScene || Q.part === 2) cut(() => setState(askSt)); else setState(askSt);
  const labels = Q.part === 1 ? Q.opts : Q.opts.map(o => o[0]);
  const short = Q.part === 1 && labels.every(l => l.length < 14);
  bubble.innerHTML = `
    <div class="meta"><span class="part">${Q.part === 1 ? "1. Bölüm · Masada" : "2. Bölüm · Dışarıda"}</span>
      <span class="count">${String(idx+1).padStart(2,"0")} / ${QUESTIONS.length}</span></div>
    <h2 class="q">${Q.q}</h2>
    <div class="timer"><div class="track"><div class="fill" id="fill"></div></div><span class="secs" id="secs">${ROUND_SECONDS} sn</span></div>
    <div class="opts ${short ? "cols" : ""}">
      ${labels.map((l,i)=>`<button class="opt" data-i="${i}"><span class="key">${"ABC"[i]}</span>${l}</button>`).join("")}
    </div>`;
  bubble.querySelectorAll(".opt").forEach(b => b.onclick = () => choose(+b.dataset.i));
  showBubble();
  startTimer();
  setTimeout(() => { if (!locked) startIdle(askSt.scene); }, 1500);
}

function startTimer(){
  cancelAnimationFrame(timerRAF);
  const t0 = performance.now(), dur = ROUND_SECONDS*1000, fill = $("fill"), secs = $("secs");
  const tick = now => {
    const left = Math.max(0, dur - (now - t0));
    fill.style.transform = `scaleX(${left/dur})`;
    fill.classList.toggle("low", left < 5000);
    const sNow = Math.ceil(left/1000);
    if (sNow !== secs._last){ if (sNow <= 5 && sNow > 0) { Snd.tick(); if (stage.dataset.scene === "cafe") stage.classList.add("idle-tap"); } secs._last = sNow; }
    secs.textContent = sNow + " sn";
    if (left <= 0) return choose(-1);
    timerRAF = requestAnimationFrame(tick);
  };
  timerRAF = requestAnimationFrame(tick);
}

function choose(i){
  if (locked) return; locked = true;
  stopIdle();
  cancelAnimationFrame(timerRAF);
  const Q = QUESTIONS[idx];
  const hasKey = Q.correct !== undefined;
  const ok = hasKey && i === Q.correct;
  let st;
  if (Q.part === 1) {
    st = ok ? TABLE.right : (i === -1 ? {...TABLE.wrong, text:"Video: Sessizlik. Adam bir süre cevap bekliyor, sonra hayal kırıklığıyla başını çeviriyor."} : TABLE.wrong);
  } else if (i === -1) {
    st = {...Q.ask, face:"surprised", tags:Q.ask.tags.filter(t => !["passer","stumble","swear","flash","angry"].includes(t)), text:"Video: Donup kalıyorsun. Sarı saçlı adam kaşını kaldırıp bir şey söylemeni bekliyor."};
  } else {
    const o = Q.opts[i][1];
    st = {scene:"street", ...o, tags: ok ? [...o.tags, "hearts"] : o.tags};
  }
  answers.push({q:Q.q, a: i === -1 ? "Cevap yok" : (Q.part === 1 ? Q.opts[i] : Q.opts[i][0]), ok, hasKey});
  Snd.click();
  if (hasKey) setTimeout(() => ok ? Snd.right() : Snd.wrong(), 250);
  if (hasKey) buzz(ok ? [25, 60, 25] : 140);
  setBpm(bpm + (hasKey ? (ok ? 11 : -7) : 4) + (Math.random()*4 - 2)); bpmLog.push(bpm);
  hideBubble();
  setState(st);
  playReaction(st.ms || REACTION_MS, () => { idx++; idx < QUESTIONS.length ? showQuestion() : showEnd(); });
}

function playReaction(ms, done){
  const bar = $("rbar"), f = $("rfill"), t0 = performance.now();
  bar.classList.add("on");
  const step = now => {
    const p = Math.min(1, (now - t0)/ms);
    f.style.transform = `scaleX(${1-p})`;
    if (p < 1) requestAnimationFrame(step); else { bar.classList.remove("on"); done(); }
  };
  requestAnimationFrame(step);
}

function bpmSvg(){
  const w = 300, h = 56, lo = Math.min(...bpmLog) - 4, hi = Math.max(...bpmLog) + 4;
  const pts = bpmLog.map((v,i) => [(i/Math.max(1,bpmLog.length-1))*(w-8)+4, h-4-((v-lo)/(hi-lo))*(h-8)]);
  const d = pts.map((p,i) => (i?"L":"M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const last = pts[pts.length-1];
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-label="Oyun boyunca kalp atışı"><path d="${d} L${last[0]} ${h} L4 ${h}Z" fill="#ff5c7a" opacity=".12"/><path d="${d}" fill="none" stroke="#ff5c7a" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`;
}
function showEnd(skip){
  if (!skip){
    bubble.classList.add("hide");
    stage.style.setProperty("--night", 1);
    setState({scene:"street", face:"soft", tags:[], shot:"crane", text:"Video: Kamera yavaşça yükselip akşam gökyüzüne doğru açılıyor."});
    setTimeout(() => titleCard("Simülasyon", "Son", 1900, () => showEnd(true)), 1600);
    return;
  }
  const right = answers.filter(a => a.ok).length;
  const good = right >= Math.ceil(scored * .6);
  $("sceneNo").textContent = "SON"; $("loc").textContent = "Kapanış";
  setState(good
    ? {scene:"street", face:"happy", tags:["wave","hearts"], shot:"ask", text:"Video: Sarı saçlı, mavi gözlü adam başını sallayarak gülüyor: \"Beni gerçekten tanıyorsun.\""}
    : {scene:"street", face:"smirk", tags:[], shot:"ask", text:"Video: Sarı saçlı, mavi gözlü adam sırıtıp sana kaşını kaldırıyor."});
  bubble.innerHTML = `
    <div class="meta"><span class="part">Son</span><span class="count">${answers.length} / ${QUESTIONS.length}</span></div>
    <h2 class="q">Simülasyon Tamamlandı!</h2>
    <div class="score"><strong>${right}/${scored}</strong><span>doğru tahmin</span></div>
    <ol class="summary">
      ${answers.map((a,n)=>`<li><span class="n">${String(n+1).padStart(2,"0")}</span>
        <span class="qq"><b>${a.a}</b>${a.q}</span>
        ${a.hasKey ? `<span class="mark ${a.ok?"ok":"no"}">${a.ok?"Doğru":"Yanlış"}</span>` : `<span class="mark act">Seçim</span>`}</li>`).join("")}
    </ol>
    <div class="bpmchart"><small>Kalp atışı · en yüksek ${Math.max(...bpmLog)} bpm</small>${bpmSvg()}</div>
    <p class="final">Seçimlerin kaydedildi. Beni iyi analiz ettiysen yarınki ilk kahveler benden. Başaramadıysan senden! ☕</p>
    <div class="actions"><button class="btn" id="again">Tekrar oyna</button><button class="btn ghost" id="copy">Sonuçları kopyala</button></div>`;
  showBubble();
  $("again").onclick = () => { idx = 0; answers = []; bpmLog.length = 0; setBpm(72); bpmLog.push(72); QUESTIONS.forEach(q => q._carded = false); showQuestion(); };
  $("copy").onclick = async e => {
    const txt = `İlk Buluşma Simülatörü — ${right}/${scored}\n` + answers.map((a,n)=>`${n+1}. ${a.q} → ${a.a}${a.hasKey?(a.ok?" ✓":" ✗"):""}`).join("\n");
    try { await navigator.clipboard.writeText(txt); e.target.textContent = "Kopyalandı"; } catch { e.target.textContent = "Kopyalanamadı"; }
  };
}

document.addEventListener("keydown", e => {
  if (locked || bubble.classList.contains("hide")) return;
  const m = {A:0,B:1,C:2,"1":0,"2":1,"3":2}[e.key.toUpperCase()];
  const btn = bubble.querySelector(`.opt[data-i="${m}"]`);
  if (btn) btn.click();
});

showIntro();
</script>
</body>
